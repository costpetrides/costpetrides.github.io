<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1d252d">
  <title>Computational Grids — Numerical Methods GFD | Constantinos Petrides</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #e9ecef; color: #1d252d; }
    a { color: inherit; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center; gap: 18px;
      padding: 14px clamp(18px, 3vw, 44px); background: #1d252d; color: #fff;
      min-height: 68px;
    }
    .topbar a { color: #e1e6ea; text-decoration: none; font-size: 13px; white-space: nowrap; }
    .topbar a:hover { text-decoration: underline; text-underline-offset: 4px; }
    .title { font-size: 14px; font-weight: 600; text-align: center; line-height: 1.45; }
    .topbar .subtitle { display: block; font-size: 11px; font-weight: 400; color: #bac4cc; }
    .topbar .mode { color: #bac4cc; font-size: 12px; white-space: nowrap; }
    .access-wrap { display: grid; place-items: center; min-height: calc(100dvh - 68px); padding: 28px 18px; }
    .access-card {
      background: #fff; border: 1px solid #d7dde1; border-radius: 6px; width: min(420px, 100%);
      padding: 35px; box-shadow: 0 12px 34px rgba(29,37,45,.06);
    }
    .access-card h1 { font-size: 24px; font-weight: 600; letter-spacing: -.03em; margin: 0 0 10px; }
    .access-card p { font-size: 14px; line-height: 1.6; color: #5b6570; margin: 0 0 26px; }
    label { display: block; font-size: 13px; margin-bottom: 9px; }
    input {
      display: block; width: 100%; border: 1px solid #acb6bf; border-radius: 4px;
      padding: 11px 13px; background: #fff; color: #1d252d; margin-bottom: 18px;
    }
    input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid #5681aa; outline-offset: 3px; }
    .unlock { background: #1d252d; color: #fff; border: 0; border-radius: 4px; padding: 12px 18px; width: 100%; }
    .error { color: #a33030 !important; margin: -5px 0 16px !important; }
    .viewer-toolbar {
      display: flex; align-items: center; justify-content: center; gap: 14px; padding: 12px 20px;
      background: #f8f9fa; border-bottom: 1px solid #d9dee2; position: sticky; top: 0; z-index: 5;
    }
    .viewer-toolbar button {
      background: #fff; border: 1px solid #c8d0d6; border-radius: 4px;
      padding: 5px 11px; min-width: 36px; min-height: 34px;
    }
    .viewer-toolbar button:hover { background: #e9edf0; }
    .viewer-toolbar button:disabled { color: #8a959d; cursor: default; }
    .viewer-toolbar .zoom-text, .viewer-toolbar .pages-text { font-size: 13px; color: #394550; white-space: nowrap; }
    .viewer-status { padding: 32px 20px; text-align: center; font-size: 14px; color: #47545e; }
    .page-stack { display: flex; align-items: center; flex-direction: column; gap: 22px; padding: 28px 20px 60px; overflow-x: auto; }
    .pdf-page {
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: #fff;
      box-shadow: 0 3px 17px rgba(29,37,45,.17); position: relative; max-width: none;
    }
    .pdf-page canvas { display: block; }
    .placeholder { color: #929ca4; font-size: 13px; }
    @media (max-width: 650px) {
      .topbar { padding: 12px 16px; }
      .topbar .mode { display: none; }
      .topbar .title { font-size: 13px; }
      .topbar a { max-width: 65px; white-space: normal; line-height: 1.2; }
      .viewer-toolbar { gap: 9px; }
      .page-stack { gap: 16px; padding: 18px 12px 36px; }
      .access-card { padding: 26px; }
    }

    .topbar{position:sticky;top:0;z-index:20}
    .contents-toggle{background:transparent;border:1px solid #69747e;border-radius:4px;color:#fff;font-size:12px;padding:8px 13px;white-space:nowrap;cursor:pointer}
    .contents-toggle:hover{background:#34404b}
    .viewer-toolbar{top:68px;flex-wrap:wrap}
    .page-nav{display:flex;align-items:center;gap:10px;margin-left:16px}
    .pdf-page{scroll-margin-top:137px}
    .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
    .contents-panel{position:fixed;top:68px;right:0;z-index:30;width:min(350px,93vw);height:calc(100dvh - 68px);overflow:auto;background:white;border-left:1px solid #d7dde1;box-shadow:-8px 0 30px #1d252d24}
    .contents-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e2e6ea;padding:16px 18px}
    .contents-header h2{font-size:16px;margin:0}
    .contents-header button{border:0;background:transparent;font-size:24px;padding:4px 9px}
    .contents-list{display:flex;flex-direction:column;padding:12px;gap:4px}
    .contents-label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:#66717b;padding:14px 9px 6px;font-weight:600}
    .contents-list button{border:0;background:white;border-radius:4px;padding:10px 12px;text-align:left;color:#32414c;font-size:13px}
    .contents-list button:hover{background:#f1f3f5}
    .contents-list button[aria-current=page]{background:#e8edf1;font-weight:600}
    @media(max-width:650px){.contents-toggle{font-size:11px;padding:7px 9px}.viewer-toolbar{padding:10px 8px}.page-nav{gap:5px;margin-left:0}.pdf-page{scroll-margin-top:156px}}
  </style>
</head>
<body>
  <header class="topbar">
    <a href="/#notes">← Notes</a>
    <div class="title">Computational Grids<span class="subtitle">Numerical Methods for Geophysical Fluid Dynamics</span></div>
    <button id="contentsToggle" class="contents-toggle" type="button" aria-expanded="false" aria-controls="contentsPanel" hidden>Contents</button>
  </header>

  <main>
    <section id="accessScreen" class="access-wrap" aria-labelledby="accessTitle">
      <form id="accessForm" class="access-card">
        <h1 id="accessTitle">Protected notes</h1>
        <p>Enter the access code to read the Computational Grids notes in your browser.</p>
        <label for="accessCode">Access code</label>
        <input id="accessCode" type="password" inputmode="numeric" autocomplete="off" required autofocus>
        <p id="accessError" class="error" role="alert" hidden>Incorrect code. Try again.</p>
        <button class="unlock" type="submit">Open notes</button>
      </form>
    </section>

    <section id="viewerScreen" hidden aria-label="Computational Grids PDF viewer">
      <div class="viewer-toolbar">
        <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
        <span id="zoomText" class="zoom-text">100%</span>
        <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
        <div class="page-nav" aria-label="PDF pages"><button id="prevPage" type="button" aria-label="Previous page" disabled>←</button><span id="currentPageLabel" class="pages-text">Page 1</span><button id="nextPage" type="button" aria-label="Next page" disabled>→</button></div><span id="pageCount" class="visually-hidden" aria-live="polite"></span>
      </div>
      <aside id="contentsPanel" class="contents-panel" hidden aria-label="Contents of this PDF"><div class="contents-header"><h2>Contents</h2><button id="contentsClose" type="button" aria-label="Close contents">×</button></div><nav id="contentsList" class="contents-list" aria-label="Pages of this document"></nav></aside><p id="viewerStatus" class="viewer-status" role="status">Loading notes…</p>
      <div id="pageStack" class="page-stack" aria-label="PDF pages"></div>
    </section>
  </main>

  <script type="module">
    const PDF_URLS = ["Computational_Grids.pdf"];
    const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";
    const PDF_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

    const form = document.getElementById("accessForm");
    const codeInput = document.getElementById("accessCode");
    const error = document.getElementById("accessError");
    const accessScreen = document.getElementById("accessScreen");
    const viewerScreen = document.getElementById("viewerScreen");
    const status = document.getElementById("viewerStatus");
    const stack = document.getElementById("pageStack");
    const pageCount = document.getElementById("pageCount");
    const zoomText = document.getElementById("zoomText");
    const zoomIn = document.getElementById("zoomIn");
    const zoomOut = document.getElementById("zoomOut");

    const SECTION_LINKS = [{"label":"3.1 · 1D Spatial Grid","page":1},{"label":"3.2 · Time Grid","page":3},{"label":"3.3 · Space–Time Grid","page":5},{"label":"3.4 · Direct Evaluation","page":6},{"label":"3.5 · Time Stepping","page":9},{"label":"3.5.2 · Index Limits","page":10},{"label":"FTCS · Worked Example","page":11},{"label":"Mixed Boundary Conditions","page":15}];
    let pdf = null;
    let zoom = 1;
    let aspect = 1.414;
    let observer = null;
    let pages = [];
    let generation = 0;
    let pdfjsLib = null;
    const pending = new Set();
    const rendered = new Set();


    // Navigation is scoped to the current PDF instance.
    const contentsToggle = document.getElementById("contentsToggle");
    const contentsPanel = document.getElementById("contentsPanel");
    const contentsClose = document.getElementById("contentsClose");
    const contentsList = document.getElementById("contentsList");
    const prevPage = document.getElementById("prevPage");
    const nextPage = document.getElementById("nextPage");
    const currentPageLabel = document.getElementById("currentPageLabel");
    let currentPage = 1;
    let scrollTick = false;
    function updateNav() {
      if (!pdf) return;
      currentPageLabel.textContent = "Page " + currentPage + " / " + pdf.numPages;
      prevPage.disabled = currentPage <= 1;
      nextPage.disabled = currentPage >= pdf.numPages;
      contentsList.querySelectorAll("button[data-page]").forEach(button => {
        if (Number(button.dataset.page) === currentPage) button.setAttribute("aria-current","page");
        else button.removeAttribute("aria-current");
      });
    }
    function closeContents() {
      contentsPanel.hidden = true;
      contentsToggle.setAttribute("aria-expanded", "false");
    }
    function goToPage(number) {
      if (!pdf || !pages.length) return;
      currentPage = Math.max(1,Math.min(pdf.numPages,number));
      updateNav();
      closeContents();
      pages[currentPage-1].scrollIntoView({behavior:"smooth",block:"start"});
    }
    function addContentsButton(label,number) {
      if (!Number.isInteger(number) || number<1 || number>pdf.numPages) return;
      const button = document.createElement("button");
      button.type = "button";
      button.dataset.page = String(number);
      button.textContent = label;
      button.addEventListener("click",()=>goToPage(number));
      contentsList.appendChild(button);
    }
    function addContentsHeader(label) {
      const node = document.createElement("div");
      node.className = "contents-label";
      node.textContent = label;
      contentsList.appendChild(node);
    }
    async function buildContents() {
      contentsList.replaceChildren();
      let count = 0;
      try {
        const outline = await pdf.getOutline();
        if (outline?.length) {
          addContentsHeader("Sections");
          async function appendOutline(items) {
            for (const item of items) {
              let destination = item.dest;
              if (typeof destination==="string") destination = await pdf.getDestination(destination);
              if (Array.isArray(destination)) {
                const first = destination[0];
                const idx = typeof first==="number" ? first : await pdf.getPageIndex(first);
                if (Number.isInteger(idx) && idx>=0 && idx<pdf.numPages) {
                  addContentsButton(item.title,idx+1);
                  count++;
                }
              }
              if (item.items?.length) await appendOutline(item.items);
            }
          }
          await appendOutline(outline);
        }
      } catch (e) { console.info("Using manual PDF page contents.",e); }
      if (!count && SECTION_LINKS.length) {
        contentsList.replaceChildren();
        addContentsHeader("Sections");
        SECTION_LINKS.forEach(s=>addContentsButton(s.label,s.page));
      }
      addContentsHeader("Pages");
      for (let number=1;number<=pdf.numPages;number++) addContentsButton("Page "+number,number);
      updateNav();
    }
    contentsToggle.addEventListener("click",()=>{
      contentsPanel.hidden = !contentsPanel.hidden;
      contentsToggle.setAttribute("aria-expanded",String(!contentsPanel.hidden));
    });
    contentsClose.addEventListener("click",closeContents);
    prevPage.addEventListener("click",()=>goToPage(currentPage-1));
    nextPage.addEventListener("click",()=>goToPage(currentPage+1));
    document.addEventListener("keydown",e=>{if(e.key==="Escape") closeContents()});
    window.addEventListener("scroll",()=>{
      if (scrollTick || !pdf) return;
      scrollTick=true;
      requestAnimationFrame(()=>{
        scrollTick=false;
        let number=pages.length;
        for(let i=0;i<pages.length;i++){
          if (pages[i].getBoundingClientRect().bottom>145){number=i+1;break}
        }
        if(currentPage!==number){currentPage=number;updateNav()}
      });
    },{passive:true});

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (codeInput.value.trim() !== "421421") {
        error.hidden = false;
        codeInput.select();
        codeInput.focus();
        return;
      }
      codeInput.value = "";
      accessScreen.hidden = true;
      viewerScreen.hidden = false;
      contentsToggle.hidden = false;
      loadDocument();
    });

    function visiblePageWidth() {
      return Math.round(Math.min(800, Math.max(270, window.innerWidth - 40)) * zoom);
    }

    function placeholder(shell, number) {
      const label = document.createElement("span");
      label.className = "placeholder";
      label.textContent = "Page " + number;
      shell.replaceChildren(label);
    }

    function updateLayout() {
      const width = visiblePageWidth();
      pages.forEach((shell, index) => {
        shell.style.width = width + "px";
        shell.style.height = Math.round(width * aspect) + "px";
        placeholder(shell, index + 1);
      });
      rendered.clear();
      pending.clear();
      generation += 1;
      if (observer) observer.disconnect();
      if (!pdf) return;
      const currentGeneration = generation;
      observer = new IntersectionObserver((entries) => {
        for (const entry of entries) {
          const number = Number(entry.target.dataset.page);
          if (entry.isIntersecting) {
            renderPage(number, currentGeneration);
          } else if (rendered.has(number)) {
            // Release off-screen canvases to keep large documents responsive.
            rendered.delete(number);
            placeholder(entry.target, number);
          }
        }
      }, { rootMargin: "650px 0px", threshold: 0 });
      pages.forEach((shell) => observer.observe(shell));
      zoomText.textContent = Math.round(zoom * 100) + "%";
      zoomOut.disabled = zoom <= 0.75;
      zoomIn.disabled = zoom >= 1.5;
    }

    async function renderPage(number, currentGeneration) {
      if (!pdf || currentGeneration !== generation || pending.has(number) || rendered.has(number)) return;
      pending.add(number);
      try {
        const page = await pdf.getPage(number);
        if (currentGeneration !== generation) return;
        const shell = pages[number - 1];
        const unscaled = page.getViewport({ scale: 1 });
        const displayWidth = visiblePageWidth();
        const displayScale = displayWidth / unscaled.width;
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 1.75);
        const viewport = page.getViewport({ scale: displayScale * pixelRatio });
        const canvas = document.createElement("canvas");
        canvas.width = Math.ceil(viewport.width);
        canvas.height = Math.ceil(viewport.height);
        canvas.style.width = displayWidth + "px";
        canvas.style.height = Math.round(viewport.height / pixelRatio) + "px";
        const context = canvas.getContext("2d", { alpha: false });
        await page.render({ canvasContext: context, viewport, canvas }).promise;
        if (currentGeneration !== generation) { canvas.width = 0; canvas.height = 0; return; }
        shell.style.height = canvas.style.height;
        shell.replaceChildren(canvas);
        rendered.add(number);
      } catch (e) {
        if (currentGeneration === generation) {
          console.error("Could not render page", number, e);
          placeholder(pages[number - 1], number);
        }
      } finally {
        if (currentGeneration === generation) pending.delete(number);
      }
    }

    async function loadDocument() {
      try {
        pdfjsLib = await import(PDFJS);
        pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER;
        let lastError;
        for (const url of PDF_URLS) {
          try {
            pdf = await pdfjsLib.getDocument({ url }).promise;
            break;
          } catch (e) { lastError = e; }
        }
        if (!pdf) throw lastError || new Error("PDF unavailable");
        const first = await pdf.getPage(1);
        const dimensions = first.getViewport({ scale: 1 });
        aspect = dimensions.height / dimensions.width;
        for (let number = 1; number <= pdf.numPages; number++) {
          const shell = document.createElement("article");
          shell.className = "pdf-page";
          shell.dataset.page = String(number);
          shell.setAttribute("aria-label", "Page " + number);
          pages.push(shell);
          stack.appendChild(shell);
        }
        pageCount.textContent = pdf.numPages + (pdf.numPages === 1 ? " page" : " pages");
        status.hidden = true;
        updateLayout();
        await buildContents();
      } catch (e) {
        console.error("PDF could not be loaded:", e);
        status.textContent = "The notes could not be displayed. Refresh this tab and try again.";
      }
    }

    zoomOut.addEventListener("click", () => {
      if (zoom > 0.75) { zoom = Math.max(0.75, +(zoom - 0.25).toFixed(2)); updateLayout(); }
    });
    zoomIn.addEventListener("click", () => {
      if (zoom < 1.5) { zoom = Math.min(1.5, +(zoom + 0.25).toFixed(2)); updateLayout(); }
    });
    let lastWidth = window.innerWidth;
    window.addEventListener("resize", () => {
      if (window.innerWidth !== lastWidth) {
        lastWidth = window.innerWidth;
        if (pdf) updateLayout();
      }
    });
  </script>
</body>
</html>
